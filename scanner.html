<!doctype html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Box Scanner</title>

  <!-- QR scanner library -->
  <script defer src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      padding: 10px;
      margin: 0;
    }

    .card {
      max-width: 520px;
      margin: auto;
      background: white;
      padding: 15px;
      border-radius: 16px;
      box-sizing: border-box;
    }

    h1 {
      margin: 8px 0 15px;
    }

    #mode {
      font-size: 20px;
      font-weight: bold;
      margin: 8px 0;
    }

    #emp {
      font-size: 16px;
      margin: 8px 0 15px;
    }

    #video {
      width: 100%;
      max-width: 480px;
      background: black;
      border-radius: 12px;
      display: block;
      margin: auto;
    }

    #status {
      font-weight: bold;
      font-size: 18px;
      margin: 15px 5px;
      min-height: 25px;
    }

    #last {
      font-size: 24px;
      font-weight: bold;
      margin: 10px;
      word-break: break-word;
    }

    #count {
      font-size: 16px;
      margin: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 17px;
      border: 0;
      border-radius: 10px;
      background: #1976d2;
      color: white;
      margin-top: 10px;
    }

    #permissionHelp {
      display: none;
      background: #fff3cd;
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
      font-size: 15px;
      line-height: 1.5;
    }

  </style>

</head>


<body>


<div class="card">

  <h1>BOX SCANNER</h1>

  <div id="mode">
    Loading...
  </div>

  <div id="emp">
    Employee:
  </div>

  <video
    id="video"
    autoplay
    playsinline
    muted>
  </video>

  <canvas
    id="canvas"
    hidden>
  </canvas>

  <div id="status">
    READY — CAMERA OR HT20 SCANNER
  </div>

  <div id="last"></div>

  <div id="count">
    Scanned: 0
  </div>

  <div id="permissionHelp">

    <b>Camera permission required</b><br><br>

    Allow camera access for this website
    and reload the page.

    <br><br>

    On Android Chrome:<br>
    Site settings → Camera → Allow

  </div>

  <button
  type="button"
  onclick="window.location.href='index.html';">
  BACK
</button>

</div>


<script>


const API =
  "https://script.google.com/macros/s/AKfycbypaGb2jp237CuXYn7fuuWy7NPDIPgNU0M12sgOEzawtEUBM3SxEKGs5culnf3wgG5X/exec";


// ==================================================
// SESSION
// ==================================================

const employee =
  localStorage.getItem("boxEmployee") || "";

const action =
  localStorage.getItem("boxAction") || "";


// ==================================================
// HTML
// ==================================================

const statusElement =
  document.getElementById("status");

const modeElement =
  document.getElementById("mode");

const employeeElement =
  document.getElementById("emp");

const lastElement =
  document.getElementById("last");

const countElement =
  document.getElementById("count");


// ==================================================
// SESSION CHECK
// ==================================================

if (!employee || !action) {

  modeElement.textContent =
    "SESSION NOT FOUND";

  employeeElement.textContent =
    "Please go back and start scanning again.";

  statusElement.textContent =
    "READY";

} else {

  if (action === "SEND") {

    modeElement.textContent =
      "GODOWN — SEND";

  } else if (action === "RECEIVE") {

    modeElement.textContent =
      "SHOP — RECEIVE";

  } else if (action === "CORRECT") {

    modeElement.textContent =
      "CORRECT — UNDO SCAN";

  } else {

    modeElement.textContent =
      action;

  }

  employeeElement.textContent =
    "Employee: " + employee;

  statusElement.textContent =
    "READY — HT20 SCANNER";

}


// ==================================================
// SCANNER VARIABLES
// ==================================================

let scannerBuffer = "";

let scannerTimer = null;

const scanned = new Set();

let activeRequests = 0;

const MAX_ACTIVE_REQUESTS = 5;

const requestQueue = [];


// ==================================================
// BUFFER RESET
// ==================================================

function resetScannerBuffer() {

  scannerBuffer = "";

  if (scannerTimer) {

    clearTimeout(scannerTimer);

    scannerTimer = null;

  }

}


// ==================================================
// PROCESS USB SCAN
// ==================================================

function processUSBScan() {

  const value =
    scannerBuffer.trim();

  resetScannerBuffer();

  if (!value) {
    return;
  }

  handleQR(value);
}


// ==================================================
// HT20 KEYBOARD INPUT
// ==================================================

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.ctrlKey ||
      event.altKey ||
      event.metaKey
    ) {
      return;
    }


    // HT20 normally sends ENTER
    // after the complete QR value

    if (event.key === "Enter") {

      event.preventDefault();

      processUSBScan();

      return;
    }


    // Capture scanner characters

    if (event.key.length === 1) {

      scannerBuffer += event.key;

      if (scannerTimer) {

        clearTimeout(scannerTimer);

      }

      scannerTimer =
        setTimeout(
          processUSBScan,
          500
        );

    }

  },
  true
);


// ==================================================
// EXTRACT BOX ID
// ==================================================

function getBoxID(text) {

  text =
    String(text || "").trim();


  // QR contains URL

  try {

    const url =
      new URL(text);

    const box =
      url.searchParams.get("box");

    if (box) {

      return box.trim();

    }

  } catch (error) {

    // Plain Box ID

  }


  return text.trim();

}


// ==================================================
// VALIDATE BOX ID
// ==================================================

function isValidBoxID(box) {

  if (!box) {
    return false;
  }


  // Old format

  if (
    /^BOX-\d+$/i.test(box)
  ) {

    return true;

  }


  // New format

  return (
    /^[A-Z0-9]+\.\d{6}-\d{5}$/i.test(box)
  );

}


// ==================================================
// HANDLE QR
// ==================================================

function handleQR(text) {

  const box =
    getBoxID(text);


  if (!isValidBoxID(box)) {

    statusElement.textContent =
      "INVALID QR";

    return;

  }


  // Duplicate protection

  if (
    scanned.has(box)
  ) {

    return;

  }


  scanned.add(box);


  countElement.textContent =
    "Scanned: " +
    scanned.size;


  lastElement.textContent =
    "✓ " + box;


  if (
    activeRequests <
    MAX_ACTIVE_REQUESTS
  ) {

    sendBox(box);

  } else {

    requestQueue.push(box);

  }

}


// ==================================================
// SEND BOX TO APPS SCRIPT
// ==================================================

function sendBox(box) {

  activeRequests++;


  statusElement.textContent =
    "Processing " +
    box +
    "...";


  const callback =
    "cb_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2);


  let finished = false;


  function finish() {

    if (finished) {
      return;
    }


    finished = true;


    delete window[callback];


    const oldScript =
      document.getElementById(
        callback
      );


    if (oldScript) {

      oldScript.remove();

    }


    activeRequests =
      Math.max(
        0,
        activeRequests - 1
      );


    if (
      requestQueue.length > 0 &&
      activeRequests <
      MAX_ACTIVE_REQUESTS
    ) {

      const nextBox =
        requestQueue.shift();

      sendBox(nextBox);

    }

  }


  // ==================================================
  // JSONP CALLBACK
  // ==================================================

  window[callback] =
    function(result) {

      try {

        if (
          result &&
          result.success
        ) {

          statusElement.textContent =
            "✓ " +
            box +
            " recorded • READY FOR NEXT BOX";

        } else {

          scanned.delete(box);

          statusElement.textContent =
            "ERROR: " +
            (
              result &&
              result.message
                ? result.message
                : "Unknown error"
            );

        }

      } catch (error) {

        scanned.delete(box);

        statusElement.textContent =
          "ERROR: " +
          error.message;

      }


      finally {

        setTimeout(
          finish,
          100
        );

      }

    };


  // ==================================================
  // REQUEST
  // ==================================================

  const params =
    new URLSearchParams();


  params.set(
    "api",
    "1"
  );

  params.set(
    "box",
    box
  );

  params.set(
    "action",
    action
  );

  params.set(
    "employee",
    employee
  );

  params.set(
    "callback",
    callback
  );

  params.set(
    "_",
    Date.now().toString()
  );


  const script =
    document.createElement(
      "script"
    );


  script.id =
    callback;

  script.async =
    true;


  script.src =
    API +
    "?" +
    params.toString();


  script.onerror =
    function() {

      scanned.delete(box);

      statusElement.textContent =
        "Connection error — please scan again";

      finish();

    };


  document.body.appendChild(
    script
  );


  // ==================================================
  // TIMEOUT
  // ==================================================

  setTimeout(
    function() {

      if (!finished) {

        scanned.delete(box);

        statusElement.textContent =
          "Connection timeout — please scan again";

        finish();

      }

    },
    15000
  );

}  
  </script>

</body>
</html>
