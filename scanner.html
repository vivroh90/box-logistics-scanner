<!doctype html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Box Scanner</title>

  <!-- QR scanner library -->
  <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      padding: 10px;
      margin: 0;
    }

    .card {
      max-width: 520px;
      margin: auto;
      background: white;
      padding: 15px;
      border-radius: 16px;
      box-sizing: border-box;
    }

    h1 {
      margin: 8px 0 15px;
    }

    #mode {
      font-size: 20px;
      font-weight: bold;
      margin: 8px 0;
    }

    #emp {
      font-size: 16px;
      margin: 8px 0 15px;
    }

    #video {
      width: 100%;
      max-width: 480px;
      background: black;
      border-radius: 12px;
      display: block;
      margin: auto;
    }

    #status {
      font-weight: bold;
      font-size: 18px;
      margin: 15px 5px;
      min-height: 25px;
    }

    #last {
      font-size: 24px;
      font-weight: bold;
      margin: 10px;
      word-break: break-word;
    }

    #count {
      font-size: 16px;
      margin: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 17px;
      border: 0;
      border-radius: 10px;
      background: #1976d2;
      color: white;
      margin-top: 10px;
    }

    #permissionHelp {
      display: none;
      background: #fff3cd;
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
      font-size: 15px;
      line-height: 1.5;
    }

  </style>

</head>


<body>


<div class="card">

  <h1>BOX SCANNER</h1>

  <div id="mode">
    Loading...
  </div>

  <div id="emp">
    Employee:
  </div>

  <video
    id="video"
    autoplay
    playsinline
    muted>
  </video>

  <canvas
    id="canvas"
    hidden>
  </canvas>

  <div id="status">
    Opening camera...
  </div>

  <div id="last"></div>

  <div id="count">
    Scanned: 0
  </div>

  <div id="permissionHelp">

    <b>Camera permission required</b><br><br>

    Allow camera access for this website
    and reload the page.

    <br><br>

    On Android Chrome:<br>
    Site settings → Camera → Allow

  </div>

  <button onclick="back()">
    BACK
  </button>

</div>


<script>


// ==================================================
// GOOGLE APPS SCRIPT
// ==================================================

const API =
"https://script.google.com/macros/s/AKfycbxuGJBYBhbVKFoGOxiqLEyA7d6n1RgufqifsUBz5h1eUQTPoE2ZPXoc_tXvSj79ZRoD/exec";

// ==================================================
// SESSION DATA
// ==================================================

const employee =
  sessionStorage.getItem("boxEmployee") || "";

const action =
  sessionStorage.getItem("boxAction") || "";


// ==================================================
// HTML ELEMENTS
// ==================================================

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext(
    "2d",
    {
      willReadFrequently: true
    }
  );

const statusElement =
  document.getElementById("status");

const modeElement =
  document.getElementById("mode");

const employeeElement =
  document.getElementById("emp");

const lastElement =
  document.getElementById("last");

const countElement =
  document.getElementById("count");

const helpElement =
  document.getElementById("permissionHelp");


// ==================================================
// VARIABLES
// ==================================================

let stream = null;

let barcodeDetector = null;

let processing = false;

let scanRunning = true;

const scanned = new Set();


// ==================================================
// DISPLAY MODE
// ==================================================

if (action === "SEND") {

  modeElement.textContent =
    "GODOWN — SEND";

}

else if (action === "RECEIVE") {

  modeElement.textContent =
    "SHOP — RECEIVE";

}

else if (action === "RETURN") {

  modeElement.textContent =
    "SHOP — RETURN";

}

else if (action === "CORRECT") {

  modeElement.textContent =
    "CORRECT — UNDO SCAN";

}

else {

  modeElement.textContent =
    "UNKNOWN MODE";

}


employeeElement.textContent =
  "Employee: " + employee;


// ==================================================
// BACK BUTTON
// ==================================================

function back() {

  stopCamera();

  location.href =
    "index.html";

}


// ==================================================
// STOP CAMERA
// ==================================================

function stopCamera() {

  scanRunning = false;

  if (stream) {

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );

    stream = null;

  }

}


// ==================================================
// CAMERA ERROR
// ==================================================

function cameraError(message) {

  statusElement.textContent =
    message;

  helpElement.style.display =
    "block";

}


// ==================================================
// START CAMERA
// ==================================================

async function startCamera() {


  // ------------------------------------------------
  // CHECK SESSION
  // ------------------------------------------------

  if (!employee || !action) {

    location.href =
      "index.html";

    return;

  }


  // ------------------------------------------------
  // CHECK BROWSER SUPPORT
  // ------------------------------------------------

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    cameraError(
      "Camera is not supported by this browser."
    );

    return;

  }


  statusElement.textContent =
    "Requesting camera permission...";


  try {


    // ------------------------------------------------
    // REQUEST REAR CAMERA
    // ------------------------------------------------

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      });


    statusElement.textContent =
      "Camera connected...";


    video.srcObject =
      stream;


    // ------------------------------------------------
    // WAIT FOR VIDEO
    // ------------------------------------------------

    await new Promise(
      function(resolve) {

        if (
          video.readyState >= 2
        ) {

          resolve();

        }

        else {

          video.onloadedmetadata =
            function() {

              resolve();

            };

        }

      }
    );


    await video.play();


    statusElement.textContent =
      "READY — SCAN BOX";


    helpElement.style.display =
      "none";


    // ------------------------------------------------
    // NATIVE BARCODE DETECTOR
    // ------------------------------------------------

    if (
      "BarcodeDetector" in window
    ) {

      try {

        barcodeDetector =
          new BarcodeDetector({

            formats: [
              "qr_code"
            ]

          });

      }

      catch (error) {

        console.log(
          "BarcodeDetector unavailable:",
          error
        );

        barcodeDetector =
          null;

      }

    }


    // ------------------------------------------------
    // START SCANNING
    // ------------------------------------------------

    requestAnimationFrame(
      scanFrame
    );


  }

  catch (error) {


    console.log(
      "Camera error:",
      error
    );


    if (
      error.name ===
      "NotAllowedError"
    ) {

      cameraError(
        "Camera permission denied."
      );

    }

    else if (
      error.name ===
      "NotFoundError"
    ) {

      cameraError(
        "No camera found on this device."
      );

    }

    else if (
      error.name ===
      "NotReadableError"
    ) {

      cameraError(
        "Camera is being used by another app."
      );

    }

    else if (
      error.name ===
      "SecurityError"
    ) {

      cameraError(
        "Camera access is blocked by browser security."
      );

    }

    else {

      cameraError(
        "Camera error: " +
        (
          error.message ||
          error.name
        )
      );

    }

  }

}


// ==================================================
// SCAN FRAME
// ==================================================

async function scanFrame() {


  if (!scanRunning) {

    return;

  }


  if (
    video.readyState >= 2 &&
    video.videoWidth > 0 &&
    video.videoHeight > 0
  ) {


    // ==================================================
    // TRY NATIVE BARCODE DETECTOR
    // ==================================================

    let nativeFound = false;


    if (barcodeDetector) {

      try {

        const codes =
          await barcodeDetector.detect(
            video
          );


        if (
          codes &&
          codes.length > 0
        ) {

          const value =
            codes[0].rawValue || "";


          if (value) {

            nativeFound = true;

            handleQR(value);

          }

        }

      }

      catch (error) {

        console.log(
          "Native QR detector error:",
          error
        );

      }

    }


    // ==================================================
    // ALWAYS TRY jsQR IF NATIVE DID NOT FIND A QR
    // ==================================================

    if (!nativeFound) {


      canvas.width =
        video.videoWidth;

      canvas.height =
        video.videoHeight;


      ctx.drawImage(

        video,

        0,

        0,

        canvas.width,

        canvas.height

      );


      try {

        const image =
          ctx.getImageData(

            0,

            0,

            canvas.width,

            canvas.height

          );


        const code =
          jsQR(

            image.data,

            image.width,

            image.height,

            {

              inversionAttempts:
                "attemptBoth"

            }

          );


        if (code) {

          handleQR(
            code.data
          );

        }

      }

      catch (error) {

        console.log(
          "jsQR scan error:",
          error
        );

      }

    }

  }


  requestAnimationFrame(
    scanFrame
  );

}


// ==================================================
// EXTRACT BOX ID FROM QR
// ==================================================

function getBoxID(text) {

  text =
    String(text || "").trim();


  // ------------------------------------------------
  // QR CONTAINS URL
  // ------------------------------------------------

  try {

    const url =
      new URL(text);


    const box =
      url.searchParams.get(
        "box"
      );


    if (box) {

      return box.trim();

    }

  }

  catch (error) {

    // QR may contain plain Box ID

  }


  // ------------------------------------------------
  // PLAIN BOX ID
  // ------------------------------------------------

  return text.trim();

}


// ==================================================
// VALIDATE BOX ID
// ==================================================

function isValidBoxID(box) {

  if (!box) {

    return false;

  }


  // Old format:
  // BOX-000001

  const oldFormat =
    /^BOX-\d+$/i.test(box);


  // New format:
  // NOV500.260928-00001
  // CA90.260928-00001

  const newFormat =
    /^[A-Z0-9]+\.\d{6}-\d{5}$/i.test(box);


  return (
    oldFormat ||
    newFormat
  );

}


// ==================================================
// QR FOUND
// ==================================================

function handleQR(text) {


  const box =
    getBoxID(text);


  // ------------------------------------------------
  // VALIDATE
  // ------------------------------------------------

  if (!isValidBoxID(box)) {

    return;

  }


  // ------------------------------------------------
  // ALREADY SCANNED
  // ------------------------------------------------

  if (
    scanned.has(box)
  ) {

    return;

  }


  // ------------------------------------------------
  // WAIT FOR PREVIOUS REQUEST
  // ------------------------------------------------

  if (processing) {

    return;

  }


  processing = true;

  scanned.add(box);


  countElement.textContent =
    "Scanned: " +
    scanned.size;


  lastElement.textContent =
    "✓ " + box;


  sendBox(box);

}


// ==================================================
// SEND BOX TO GOOGLE APPS SCRIPT
// ==================================================

function sendBox(box) {


  statusElement.textContent =
    "Processing " +
    box +
    "...";


  // ------------------------------------------------
  // CREATE UNIQUE CALLBACK
  // ------------------------------------------------

  const callback =
    "cb_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2);


  let finished = false;


  // ------------------------------------------------
  // FINISH REQUEST
  // ------------------------------------------------

  function finish() {


    if (finished) {

      return;

    }


    finished = true;


    delete window[
      callback
    ];


    const script =
      document.getElementById(
        callback
      );


    if (script) {

      script.remove();

    }


    processing =
      false;

  }


  // ------------------------------------------------
  // JSONP CALLBACK
  // ------------------------------------------------

  window[callback] =
    function(result) {


      try {


        if (
          result &&
          result.ok
        ) {


          // ----------------------------------------
          // SUCCESS
          // ----------------------------------------

          if (
            action ===
            "CORRECT"
          ) {

            statusElement.textContent =
              "✓ " +
              (
                result.message ||
                "Correction completed"
              );

          }

          else {

            statusElement.textContent =
              "✓ " +
              box +
              " recorded • READY FOR NEXT BOX";

          }


        }

        else {


          // ----------------------------------------
          // APPS SCRIPT RETURNED ERROR
          // ----------------------------------------

          scanned.delete(
            box
          );


          statusElement.textContent =
            "ERROR: " +
            (
              result &&
              result.message
                ? result.message
                : "Unknown error"
            );

        }

      }

      catch (error) {


        scanned.delete(
          box
        );


        statusElement.textContent =
          "ERROR: " +
          (
            error.message ||
            "Response processing failed"
          );

      }


      finally {


        setTimeout(
          finish,
          100
        );

      }

    };


  // ------------------------------------------------
  // REQUEST PARAMETERS
  // ------------------------------------------------

  const params =
    new URLSearchParams();


  params.set(
    "api",
    "1"
  );


  params.set(
    "box",
    box
  );


  params.set(
    "action",
    action
  );


  params.set(
    "employee",
    employee
  );


  params.set(
    "callback",
    callback
  );


  // Prevent browser/cache interference

  params.set(
    "_",
    Date.now().toString()
  );


  // ------------------------------------------------
  // CREATE JSONP SCRIPT
  // ------------------------------------------------

  const script =
    document.createElement(
      "script"
    );


  script.id =
    callback;


  script.async =
    true;


  script.src =
    API +
    "?" +
    params.toString();


  // ------------------------------------------------
  // CONNECTION ERROR
  // ------------------------------------------------

  script.onerror =
    function() {


      scanned.delete(
        box
      );


      statusElement.textContent =
        "Connection error — API request failed";


      finish();

    };


  // ------------------------------------------------
  // TIMEOUT
  // ------------------------------------------------

  setTimeout(
    function() {


      if (!finished) {


        scanned.delete(
          box
        );


        statusElement.textContent =
          "Connection timeout — please scan again";


        finish();

      }

    },
    15000
  );


  // ------------------------------------------------
  // SEND REQUEST
  // ------------------------------------------------

  document.body.appendChild(
    script
  );

}


// ==================================================
// START
// ==================================================

startCamera();


</script>


</body>

</html>
