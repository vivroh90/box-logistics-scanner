<!doctype html>
<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Box Scanner</title>

<script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>

<style>

body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #f5f5f5;
  padding: 10px;
  margin: 0;
}

.card {
  max-width: 520px;
  margin: auto;
  background: white;
  padding: 15px;
  border-radius: 16px;
  box-sizing: border-box;
}

h1 {
  margin: 8px 0 15px;
}

#mode {
  font-size: 20px;
  font-weight: bold;
  margin: 8px 0;
}

#emp {
  font-size: 16px;
  margin: 8px 0 15px;
}

#video {
  width: 100%;
  max-width: 480px;
  background: black;
  border-radius: 12px;
  display: block;
  margin: auto;
}

#status {
  font-weight: bold;
  font-size: 18px;
  margin: 15px 5px;
}

#last {
  font-size: 24px;
  font-weight: bold;
  margin: 10px;
  word-break: break-all;
}

#count {
  font-size: 16px;
  margin: 10px;
}

button {
  width: 100%;
  padding: 14px;
  font-size: 17px;
  border: 0;
  border-radius: 10px;
  background: #1976d2;
  color: white;
  margin-top: 10px;
}

#permissionHelp {
  display: none;
  background: #fff3cd;
  border-radius: 10px;
  padding: 12px;
  margin-top: 10px;
  font-size: 15px;
  line-height: 1.5;
}

</style>

</head>


<body>

<div class="card">

<h1>BOX SCANNER</h1>

<div id="mode">
Loading...
</div>

<div id="emp">
Employee:
</div>

<video
  id="video"
  autoplay
  playsinline
  muted>
</video>

<canvas
  id="canvas"
  hidden>
</canvas>

<div id="status">
Opening camera...
</div>

<div id="last"></div>

<div id="count">
Scanned: 0
</div>

<div id="permissionHelp">

<b>Camera permission required</b><br><br>

Allow camera access for this website
and reload the page.

<br><br>

On Android Chrome:<br>
Site settings → Camera → Allow

</div>

<button onclick="back()">
BACK
</button>

</div>


<script>


/*************************************************
 * GOOGLE APPS SCRIPT
 *************************************************/

const API =
"https://script.google.com/macros/s/AKfycbxuGJBYBhbVKFoGOxiqLEyA7d6n1RgufqifsUBz5h1eUQTPoE2zPXoc_tXvSj79ZRoD/exec";


/*************************************************
 * SESSION DATA
 *************************************************/

const employee =
  sessionStorage.getItem("boxEmployee") || "";

const action =
  sessionStorage.getItem("boxAction") || "";


/*************************************************
 * HTML ELEMENTS
 *************************************************/

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d", {
    willReadFrequently: true
  });

const statusElement =
  document.getElementById("status");

const modeElement =
  document.getElementById("mode");

const employeeElement =
  document.getElementById("emp");

const lastElement =
  document.getElementById("last");

const countElement =
  document.getElementById("count");

const helpElement =
  document.getElementById("permissionHelp");


/*************************************************
 * VARIABLES
 *************************************************/

let stream = null;
let barcodeDetector = null;
let processing = false;
let scanRunning = true;

const scanned = new Set();


/*************************************************
 * DISPLAY MODE
 *************************************************/

if (action === "SEND") {

  modeElement.textContent =
    "GODOWN — SEND";

}

else if (action === "RECEIVE") {

  modeElement.textContent =
    "SHOP — RECEIVE";

}

else if (action === "RETURN") {

  modeElement.textContent =
    "SHOP — RETURN";

}

else if (action === "CORRECT") {

  modeElement.textContent =
    "CORRECT — UNDO SCAN";

}

else {

  modeElement.textContent =
    "UNKNOWN MODE";

}


employeeElement.textContent =
  "Employee: " + employee;


/*************************************************
 * BACK
 *************************************************/

function back() {

  stopCamera();

  location.href = "index.html";

}


/*************************************************
 * STOP CAMERA
 *************************************************/

function stopCamera() {

  scanRunning = false;

  if (stream) {

    stream
      .getTracks()
      .forEach(function(track) {
        track.stop();
      });

    stream = null;
  }

}


/*************************************************
 * CAMERA ERROR
 *************************************************/

function cameraError(message) {

  statusElement.textContent =
    message;

  helpElement.style.display =
    "block";

}


/*************************************************
 * START CAMERA
 *************************************************/

async function startCamera() {

  if (!employee || !action) {

    location.href =
      "index.html";

    return;
  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    cameraError(
      "Camera is not supported by this browser."
    );

    return;
  }


  statusElement.textContent =
    "Requesting camera permission...";


  try {

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      });


    statusElement.textContent =
      "Camera connected...";


    video.srcObject =
      stream;


    await new Promise(function(resolve) {

      if (video.readyState >= 2) {

        resolve();

      }

      else {

        video.onloadedmetadata =
          function() {
            resolve();
          };

      }

    });


    await video.play();


    statusElement.textContent =
      "READY — SCAN BOX";


    helpElement.style.display =
      "none";


    /*************************************************
     * NATIVE BARCODE DETECTOR
     *************************************************/

    if ("BarcodeDetector" in window) {

      try {

        barcodeDetector =
          new BarcodeDetector({
            formats: ["qr_code"]
          });

      }

      catch (error) {

        barcodeDetector = null;

      }

    }


    requestAnimationFrame(scanFrame);

  }


  catch (error) {

    console.log(
      "Camera error:",
      error
    );


    if (
      error.name ===
      "NotAllowedError"
    ) {

      cameraError(
        "Camera permission denied."
      );

    }

    else if (
      error.name ===
      "NotFoundError"
    ) {

      cameraError(
        "No camera found on this device."
      );

    }

    else if (
      error.name ===
      "NotReadableError"
    ) {

      cameraError(
        "Camera is being used by another app."
      );

    }

    else {

      cameraError(
        "Camera error: " +
        (
          error.message ||
          error.name
        )
      );

    }

  }

}


/*************************************************
 * SCAN FRAME
 *************************************************/

async function scanFrame() {

  if (!scanRunning) {
    return;
  }


  if (
    video.readyState >= 2 &&
    video.videoWidth > 0 &&
    video.videoHeight > 0
  ) {


    /*************************************************
     * NATIVE BARCODE DETECTOR
     *************************************************/

    if (barcodeDetector) {

      try {

        const codes =
          await barcodeDetector.detect(video);


        if (
          codes &&
          codes.length > 0
        ) {

          const value =
            codes[0].rawValue || "";

          if (value) {

            handleQR(value);

          }

        }

      }

      catch (error) {

        // Ignore detector errors.

      }

    }


    /*************************************************
     * jsQR FALLBACK
     *************************************************/

    if (!barcodeDetector) {

      canvas.width =
        video.videoWidth;

      canvas.height =
        video.videoHeight;


      ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );


      try {

        const image =
          ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
          );


        const code =
          jsQR(
            image.data,
            image.width,
            image.height,
            {
              inversionAttempts:
                "dontInvert"
            }
          );


        if (code) {

          handleQR(code.data);

        }

      }

      catch (error) {

        console.log(
          "QR scan error:",
          error
        );

      }

    }

  }


  requestAnimationFrame(scanFrame);

}


/*************************************************
 * EXTRACT BOX ID
 *
 * Supports:
 *
 * https://.../?box=BOX-000001
 *
 * https://.../?box=CA90.260928-00001
 *
 * https://.../?box=NOV500.260928-00001
 *
 * Plain IDs also work.
 *************************************************/

function getBoxID(text) {

  text =
    String(text || "").trim();


  /*************************************************
   * QR contains URL
   *************************************************/

  try {

    const url =
      new URL(text);


    const box =
      url.searchParams.get("box");


    if (box) {

      return decodeURIComponent(
        box
      )
      .trim()
      .toUpperCase();

    }

  }

  catch (error) {

    // QR may contain plain Box ID.

  }


  /*************************************************
   * Plain Box ID
   *************************************************/

  return text
    .trim()
    .toUpperCase();

}


/*************************************************
 * VALIDATE BOX ID
 *
 * IMPORTANT:
 *
 * OLD:
 * BOX-000001
 *
 * NEW:
 * CA90.260928-00001
 * NOV500.260928-00001
 *
 * The backend performs the final
 * Product Master validation.
 *************************************************/

function isValidBoxID(box) {

  if (!box) {
    return false;
  }


  /*************************************************
   * OLD BOX FORMAT
   *************************************************/

  if (
    /^BOX-\d+$/i.test(box)
  ) {

    return true;

  }


  /*************************************************
   * NEW PRODUCT/DATE FORMAT
   *
   * Example:
   * CA90.260928-00001
   * NOV500.260928-00001
   *************************************************/

  if (
    /^[A-Z0-9]+?\.\d{6}-\d{5}$/i.test(box)
  ) {

    return true;

  }


  return false;

}


/*************************************************
 * QR FOUND
 *************************************************/

function handleQR(text) {

  const box =
    getBoxID(text);


  /*************************************************
   * VALIDATE
   *************************************************/

  if (!isValidBoxID(box)) {

    return;

  }


  /*************************************************
   * ALREADY SCANNED
   *************************************************/

  if (
    scanned.has(box)
  ) {

    return;

  }


  /*************************************************
   * WAIT FOR PREVIOUS REQUEST
   *************************************************/

  if (processing) {

    return;

  }


  processing = true;

  scanned.add(box);


  countElement.textContent =
    "Scanned: " +
    scanned.size;


  lastElement.textContent =
    "✓ " + box;


  sendBox(box);

}


/*************************************************
 * SEND BOX TO APPS SCRIPT
 *************************************************/

function sendBox(box) {

  statusElement.textContent =
    "Processing " +
    box +
    "...";


  const callback =
    "cb_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2);


  window[callback] =
    function(result) {

      try {

        if (
          result &&
          result.ok
        ) {

          if (action === "RETURN") {

            statusElement.textContent =
              "✓ " +
              box +
              " RETURNED — READY FOR NEXT BOX";

          }

          else if (action === "CORRECT") {

            statusElement.textContent =
              "✓ " +
              result.message;

          }

          else {

            statusElement.textContent =
              "✓ " +
              box +
              " recorded • READY FOR NEXT BOX";

          }

        }

        else {

          scanned.delete(box);

          statusElement.textContent =
            "ERROR: " +
            (
              result &&
              result.message
                ? result.message
                : "Unknown error"
            );

        }

      }

      finally {

        delete window[callback];


        const script =
          document.getElementById(callback);


        if (script) {
          script.remove();
        }


        setTimeout(
          function() {
            processing = false;
          },
          500
        );

      }

    };


  /*************************************************
   * REQUEST PARAMETERS
   *************************************************/

  const params =
    new URLSearchParams({

      api: "1",

      box: box,

      action: action,

      employee: employee,

      callback: callback

    });


  /*************************************************
   * JSONP REQUEST
   *************************************************/

  const script =
    document.createElement("script");


  script.id =
    callback;


  script.src =
    API +
    "?" +
    params.toString();


  script.onerror =
    function() {

      scanned.delete(box);


      statusElement.textContent =
        "Connection error — scan again";


      delete window[callback];

      script.remove();

      processing = false;

    };


  document.body.appendChild(script);

}


/*************************************************
 * START
 *************************************************/

startCamera();

</script>

</body>
</html>
