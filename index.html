<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Box Logistics</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f5f5f5;
      padding: 20px;
    }

    .card {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 16px;
    }

    input, select, button {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      font-size: 18px;
      box-sizing: border-box;
      border-radius: 10px;
    }

    input, select {
      border: 1px solid #bbb;
    }

    button {
      background: #1976d2;
      color: white;
      border: 0;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>BOX LOGISTICS</h1>

  <select id="mode">
    <option value="SEND">GODOWN — SEND</option>
    <option value="RECEIVE">SHOP — RECEIVE</option>
  </select>

  <input
    id="employee"
    placeholder="Employee name"
    autocomplete="name"
  >

  <button onclick="start()">
    START SCANNING
  </button>

</div>

<script>

function start() {

  const employee =
    document.getElementById("employee").value.trim();

  const action =
    document.getElementById("mode").value;

  if (!employee) {
    alert("Enter employee name");
    return;
  }

  sessionStorage.setItem(
    "boxEmployee",
    employee
  );

  sessionStorage.setItem(
    "boxAction",
    action
  );

  // Open camera on NEW PAGE
  location.href = "scanner.html";
}

</script>

</body>
</html>
