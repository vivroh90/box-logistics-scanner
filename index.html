<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Box Logistics</title>
<style>
body{font-family:Arial,sans-serif;text-align:center;margin:0;padding:20px;background:#f7f7f7}
.card{max-width:520px;margin:auto;background:white;padding:20px;border-radius:16px}
h1{margin-top:5px}
input,select,button{width:100%;box-sizing:border-box;padding:15px;margin:8px 0;font-size:18px;border-radius:10px}
input,select{border:1px solid #bbb}
button{border:0;color:#fff;background:#1976d2}
.small{font-size:13px;color:#666}
</style>
</head>
<body>
<div class="card">
<h1>BOX LOGISTICS</h1>
<select id="mode">
<option value="SEND">GODOWN — SEND</option>
<option value="RECEIVE">SHOP — RECEIVE</option>
</select>
<input id="employee" placeholder="Employee name" autocomplete="name">
<button onclick="start()">START SCANNING</button>
<p class="small">The camera scanner will open on a separate page.</p>
</div>
<script>
function start(){
  const employee=document.getElementById("employee").value.trim();
  const action=document.getElementById("mode").value;
  if(!employee){alert("Enter employee name first");return;}
  sessionStorage.setItem("boxEmployee",employee);
  sessionStorage.setItem("boxAction",action);
  window.location.href="scanner.html";
}
</script>
</body>
</html>
